<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloud Run Remote Browser</title><link rel="stylesheet" href="/style.css"></head>
<body class="app-body"><header class="toolbar"><span class="brand">Remote Browser</span><button id="back" aria-label="戻る" title="戻る">←</button><button id="forward" aria-label="進む" title="進む">→</button><button id="reload" aria-label="再読込" title="再読込">↻</button><form id="nav-form" class="nav-form"><label for="address" class="sr-only">URL</label><input id="address" type="url" placeholder="https://example.com" spellcheck="false" autocomplete="off" required><button type="submit">移動</button></form><button id="logout">ログアウト</button></header>
<main class="workspace"><div class="status" id="status" role="status">接続中…</div><div class="screen-wrap"><img id="screen" tabindex="0" alt="Cloud Run上で動作するブラウザの画面。クリックしてキーボード操作できます。" draggable="false"></div><p class="hint">画面をクリックすると入力できます。文字入力、スクロール、戻る／進むに対応します。外部サイトはCloud Run上のChromiumで表示され、訪問先のリソースを利用者の端末から直接読み込みません。</p></main>
<script src="/app.js" defer></script></body></html>
